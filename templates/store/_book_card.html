<div class="col-6 col-md-4 col-lg-3">
  <article class="book-card">
    <a href="{% url 'book_detail' book.pk %}" class="text-decoration-none">
      <div class="book-art" style="background:{{ book.cover_color }}18">
        {% if book.cover_image %}
          <img src="{{ book.cover_image.url }}" alt="{{ book.title }}">
        {% else %}
          <span style="background:{{ book.cover_color }}">{{ book.title }}</span>
        {% endif %}
      </div>
    </a>
    <div class="book-title"><a href="{% url 'book_detail' book.pk %}">{{ book.title }}</a></div>
    <div class="book-author mb-2">{{ book.author }} · {{ book.category.name }}</div>
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <span class="price">₹{{ book.price|floatformat:"0u" }}</span>
      <a class="small-btn" href="{% url 'book_detail' book.pk %}">View Details</a>
    </div>
    <button class="btn btn-green btn-sm w-100 mt-3 add-to-cart"
            data-id="{{ book.pk }}" data-title="{{ book.title }}"
            data-price="{{ book.price|floatformat:'0u' }}">Add to Cart</button>
  </article>
</div>
