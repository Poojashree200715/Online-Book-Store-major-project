{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}BookHaven | Online Book Store{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top shadow-sm">
  <div class="container py-2">
    <a class="navbar-brand brand" href="{% url 'home' %}">Book<span>Haven.</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#mainNav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#categories">Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#books">Books</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#newsletter">Newsletter</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#cart">🛒 Cart (<span id="cartCount">0</span>)</a></li>
      </ul>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="py-4 mt-4">
  <div class="container d-flex flex-wrap justify-content-between gap-2">
    <span class="brand">Book<span>Haven.</span></span>
    <span class="muted small">A good book opens a new world.</span>
    <span class="muted small">© 2026 BookHaven</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'store/cart.js' %}"></script>
</body>
</html>
